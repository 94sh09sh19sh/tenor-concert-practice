<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tenor 聲部練習</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E">
<meta name="description" content="Tenor 聲部示範播放器（《我只想跟你一起去聽音樂會》、Cantate Domino in B♭、The Lord Bless You and Keep You）：可切換曲目、調速度、從任一小節開始、顯示歌詞。">
<style>
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --ink: #1d1b18;
  --muted: #6b665e;
  --line: #e2ddd3;
  --accent: #b4532a;
  --accent-soft: #f3e2d7;
  --now: #2f6f5e;
  --now-soft: #dcefe8;
  --rest: #c9c3b8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513;
    --surface: #201f1c;
    --ink: #ece8e1;
    --muted: #a29c92;
    --line: #34312c;
    --accent: #e08a5f;
    --accent-soft: #3b2a20;
    --now: #6cc4a9;
    --now-soft: #1f3a32;
    --rest: #4a463f;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  line-height: 1.5;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 1.35rem; margin: 0 0 2px; letter-spacing: .02em; }
.sub { color: var(--muted); font-size: .9rem; margin: 0 0 18px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 14px;
}
.transport { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button {
  font: inherit;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 96px; font-weight: 600; }
.now {
  margin-left: auto;
  display: flex; gap: 14px; align-items: baseline;
  font-variant-numeric: tabular-nums;
}
.now .m { color: var(--muted); font-size: .9rem; }
.now .note { font-size: 1.6rem; font-weight: 700; color: var(--now); min-width: 3.2em; text-align: right; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 20px; margin-top: 14px; }
label.row { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--muted); }
label.row .val { color: var(--ink); font-weight: 600; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=number] {
  font: inherit; width: 5em; padding: 4px 6px;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink);
}
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .9rem; }
.checks label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.lyric-big {
  font-size: 1.5rem; min-height: 2.4em; line-height: 1.6;
  display: flex; flex-wrap: wrap; gap: 0 .3em; align-items: center;
}
.lyric-big .syl { color: var(--muted); transition: color .08s; }
.lyric-big .syl.done { color: var(--ink); }
.lyric-big .syl.cur { color: var(--accent); font-weight: 700; }
.lyric-big .bar { color: var(--line); }
canvas#roll { width: 100%; height: 210px; display: block; border-radius: 8px; background: var(--bg); cursor: pointer; }
.hint { font-size: .8rem; color: var(--muted); margin-top: 6px; }
.roll-opts { display: flex; justify-content: flex-end; margin-top: 8px; font-size: .85rem; color: var(--muted); }
.roll-opts label { display: inline-flex; align-items: center; gap: 6px; }
.sections { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.sections button { padding: 4px 10px; font-size: .85rem; }
.measures {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 6px;
}
.ms {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  min-height: 58px;
  background: var(--surface);
  position: relative;
}
.ms:hover { border-color: var(--muted); }
.ms .no { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.ms .no b { color: var(--accent); margin-left: 4px; }
.ms .ly { font-size: .95rem; word-break: break-word; }
.ms .ly .r { color: var(--rest); }
.ms .ly .cur { color: var(--accent); font-weight: 700; }
.ms.start { box-shadow: inset 0 0 0 2px var(--accent); }
.ms.inloop { background: var(--accent-soft); }
.ms.playing { background: var(--now-soft); border-color: var(--now); }
.ms .flag { position: absolute; top: 5px; right: 7px; font-size: .7rem; color: var(--accent); }
.notes h2 { font-size: 1rem; margin: 0 0 6px; }
.notes ul { margin: 6px 0 0; padding-left: 1.2em; font-size: .9rem; }
.notes li { margin: 3px 0; }
.notes p { font-size: .9rem; margin: 6px 0; }
.legend { font-size: .8rem; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 10px; vertical-align: -1px; }
.songs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.songs button { padding: 6px 12px; font-size: .9rem; border-radius: 999px; }
.songs button.on { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
@media (max-width: 560px) {
  .now { margin-left: 0; width: 100%; justify-content: space-between; }
  .lyric-big { font-size: 1.25rem; }
  .measures { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="songs" id="songs" role="tablist" aria-label="選擇曲目"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>

  <div class="card">
    <div class="transport">
      <button id="play" class="primary">▶ 播放</button>
      <button id="stop">■ 停止</button>
      <button id="prev" title="前一小節">◀ 小節</button>
      <button id="next" title="下一小節">小節 ▶</button>
      <div class="now">
        <span class="m" id="nowM">第 1 小節</span>
        <span class="note" id="nowNote">–</span>
      </div>
    </div>

    <div class="grid2">
      <label class="row"><span id="tempoLabel">速度</span><span class="val" id="tempoVal">70</span>
        <input type="range" id="tempo" min="30" max="100" step="1" value="70">
      </label>
      <label class="row">從第幾小節開始
        <span><input type="number" id="startM" min="1" value="1"> 到 <input type="number" id="endM" min="1" value="1"> 小節</span>
      </label>
      <label class="row">音色
        <select id="timbre">
          <option value="voice">人聲（oo）</option>
          <option value="piano">鋼琴</option>
          <option value="pure">純音</option>
        </select>
      </label>
      <label class="row">音量<span class="val" id="volVal">80%</span>
        <input type="range" id="vol" min="0" max="100" value="80">
      </label>
    </div>
    <div class="checks" style="margin-top:12px">
      <label><input type="checkbox" id="metro" checked> <span id="metroLabel">節拍器</span></label>
      <label><input type="checkbox" id="countin" checked> 預備拍一小節</label>
      <label><input type="checkbox" id="loop"> 重複播放所選範圍</label>
      <label><input type="checkbox" id="ritard" checked> 依譜面漸慢（rit.）</label>
    </div>
  </div>

  <div class="card">
    <div class="lyric-big" id="lyricBig"></div>
    <div class="roll-opts">
      <label>音高標示
        <select id="pitchLabel">
          <option value="solfa">唱名（首調）</option>
          <option value="name">音名（實際音高）</option>
          <option value="none">不標示</option>
        </select>
      </label>
    </div>
    <canvas id="roll"></canvas>
    <div class="hint" id="rollHint"></div>
  </div>

  <div class="card">
    <div class="sections" id="sections"></div>
    <div class="measures" id="measures"></div>
    <div class="legend">點一下小節＝從那裡開始播放<span style="background:var(--accent-soft)"></span>播放範圍<span style="background:var(--now-soft)"></span>正在播放</div>
  </div>

  <div class="card notes" id="notes"></div>
</div>

<script>

    notes: `<h2>使用說明與注意事項</h2>

// ===== 音高 =====
const PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function parsePitch(p) {
  const m = /^([A-G])(#|b)?(\d)$/.exec(p);
  if (!m) throw new Error('音高格式錯誤：' + p);
  return m;
}
function toMidi(p) {
  const m = parsePitch(p);
  const acc = m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0;
  return (+m[3] + 1) * 12 + PC[m[1]] + acc - 12; // 低八度＝實際音高
}
function noteLabel(p) {
  const m = parsePitch(p);
  const acc = m[2] === '#' ? '♯' : m[2] === 'b' ? '♭' : '';
  return m[1] + acc + (+m[3] - 1);
}
// 首調唱名：依該小節的調號，以主音為 Do；臨時升降記號標在前面（例如 ♭Mi）
const LETTERS = 'CDEFGAB';
const MAJOR = [0, 2, 4, 5, 7, 9, 11];
const SOLFA = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si'];
function solfaLabel(p, m) {
  const r = parsePitch(p);
  const k = SONG.keyOf(m);
  const deg = (LETTERS.indexOf(r[1]) - LETTERS.indexOf(k.letter) + 7) % 7;
  const pc = PC[r[1]] + (r[2] === '#' ? 1 : r[2] === 'b' ? -1 : 0);
  const diff = ((pc - k.pc - MAJOR[deg]) % 12 + 18) % 12 - 6;
  return (diff > 0 ? '♯' : diff < 0 ? '♭' : '') + SOLFA[deg];
}

function $(id) { return document.getElementById(id); }

// ===== 目前曲目（切換曲目時重建）=====
let SONG, SCORE, BEATS_PER_BAR, TOTAL_M, MIN_MIDI, MAX_MIDI;
let events = [], measureStart = [];
let msEls = [], sylEls = {};

// ===== 展開成事件 =====
function buildEvents() {
  events = [];
  measureStart = [];
  let t = 0;
  let pending = null;
  SCORE.forEach((bar, i) => {
    const m = i + 1;
    measureStart[m] = t;
    let sum = 0;
    bar.forEach((n, j) => {
      const [raw, dur, lyric = ''] = n;
      sum += dur;
      if (raw === 'r') { t += dur; return; }
      const tie = raw.endsWith('~');
      const p = tie ? raw.slice(0, -1) : raw;
      if (pending && pending.p === p) {
        pending.dur += dur;
      } else {
        pending = { m, j, start: t, dur, p, midi: toMidi(p), label: noteLabel(p), solfa: solfaLabel(p, m), lyric };
        events.push(pending);
      }
      if (!tie) pending = null;
      t += dur;
    });
    if (Math.abs(sum - barLen(m)) > 1e-6) console.warn(SONG.id + ' 第 ' + m + ' 小節拍數不符：' + sum);
  });
  measureStart[SCORE.length + 1] = t;
  MIN_MIDI = Math.min(...events.map(e => e.midi)) - 2;
  MAX_MIDI = Math.max(...events.map(e => e.midi)) + 2;
}

// 該小節的拍數（以四分音符計）；曲目可用 barBeats 指定變拍子的小節
function barLen(m) { return (SONG.barBeats && SONG.barBeats[m]) || BEATS_PER_BAR; }

function ritardFactor(m) {
  let f = SONG.tempoFactor(m);
  if (!$('ritard').checked) return f;
  for (const [a, b] of SONG.ritards) {
    if (m >= a && m <= b) {
      const n = b - a + 1, k = m - a + 1;
      return f * (1 - 0.2 * k / n);
    }
  }
  return f;
}

// ===== DOM =====
const ui = {
  play: $('play'), stop: $('stop'), prev: $('prev'), next: $('next'),
  tempo: $('tempo'), tempoVal: $('tempoVal'), startM: $('startM'), endM: $('endM'),
  vol: $('vol'), volVal: $('volVal'), timbre: $('timbre'),
  nowM: $('nowM'), nowNote: $('nowNote'), lyricBig: $('lyricBig'),
  measures: $('measures'), sections: $('sections'), roll: $('roll'),
};

const songBtns = {};
SONGS.forEach(s => {
  const b = document.createElement('button');
  b.textContent = s.tab;
  b.setAttribute('role', 'tab');
  b.addEventListener('click', () => { if (SONG !== s) loadSong(s.id); });
  $('songs').appendChild(b);
  songBtns[s.id] = b;
});

function renderSong() {
  document.title = SONG.tab + '｜Tenor 聲部練習';
  $('title').textContent = SONG.title;
  $('sub').textContent = SONG.sub;
  $('tempoLabel').textContent = SONG.tempo.label;
  $('metroLabel').textContent = SONG.metroLabel;
  $('rollHint').textContent = SONG.hint;
  $('notes').innerHTML = SONG.notes;
  ui.tempo.min = SONG.tempo.min; ui.tempo.max = SONG.tempo.max;
  ui.startM.max = TOTAL_M; ui.endM.max = TOTAL_M;
  Object.entries(songBtns).forEach(([id, b]) => {
    b.classList.toggle('on', id === SONG.id);
    b.setAttribute('aria-selected', id === SONG.id ? 'true' : 'false');
  });

  ui.measures.innerHTML = '';
  ui.sections.innerHTML = '';
  msEls = [];
  sylEls = {};
  SCORE.forEach((bar, i) => {
    const m = i + 1;
    const el = document.createElement('div');
    el.className = 'ms';
    const sec = SONG.sections.find(s => s[1] === m && s[2]);
    el.innerHTML = '<div class="no">' + m + (sec ? '<b>' + sec[2] + '</b>' : '') + '</div><div class="ly"></div>';
    if (SONG.unsure.includes(m)) {
      const f = document.createElement('span'); f.className = 'flag'; f.textContent = '?'; f.title = '這小節判讀較沒把握'; el.appendChild(f);
    }
    const ly = el.querySelector('.ly');
    let any = false;
    bar.forEach((n, j) => {
      const lyric = n[2];
      if (n[0] !== 'r' && lyric) {
        const s = document.createElement('span');
        s.textContent = lyric + (/[A-Za-z,!'/]$/.test(lyric) ? ' ' : '');
        ly.appendChild(s);
        sylEls[m + '-' + j] = s;
        any = true;
      }
    });
    if (!any) {
      const allRest = bar.every(n => n[0] === 'r');
      ly.innerHTML = allRest ? '<span class="r">休息</span>' : '<span class="r">（延長）</span>';
    }
    el.addEventListener('click', () => { setStart(m); startPlayback(); });
    ui.measures.appendChild(el);
    msEls[m] = el;
  });

  SONG.sections.forEach(([name, m]) => {
    const b = document.createElement('button');
    b.textContent = name + '（' + m + '）';
    b.addEventListener('click', () => { setStart(m); startPlayback(); });
    ui.sections.appendChild(b);
  });
}

function clampM(v) { return Math.max(1, Math.min(TOTAL_M, Math.round(+v || 1))); }
function setStart(m) {
  m = clampM(m);
  ui.startM.value = m;
  if (+ui.endM.value < m) ui.endM.value = TOTAL_M;
  refreshRange();
  showMeasure(m, null);
  save();
}
function refreshRange() {
  const a = clampM(ui.startM.value), b = clampM(ui.endM.value);
  msEls.forEach((el, m) => {
    if (!el) return;
    el.classList.toggle('start', m === a);
    el.classList.toggle('inloop', m >= a && m <= b && !(a === 1 && b === TOTAL_M));
  });
}

// ===== 歌詞大字 =====
let bigFor = -1;
function renderBig(m) {
  if (bigFor === m) return;
  bigFor = m;
  ui.lyricBig.innerHTML = '';
  const from = Math.max(1, m - 1), to = Math.min(TOTAL_M, m + 2);
  for (let k = from; k <= to; k++) {
    SCORE[k - 1].forEach((n, j) => {
      if (n[0] === 'r' || !n[2]) return;
      const s = document.createElement('span');
      s.className = 'syl' + (k < m ? ' done' : '');
      s.dataset.key = k + '-' + j;
      s.textContent = n[2];
      ui.lyricBig.appendChild(s);
    });
    if (k < to) {
      const b = document.createElement('span'); b.className = 'bar'; b.textContent = '｜'; ui.lyricBig.appendChild(b);
    }
  }
  if (!ui.lyricBig.querySelector('.syl')) ui.lyricBig.innerHTML = '<span class="syl">（休息）</span>';
}

let lastCurKey = null;
function showMeasure(m, ev) {
  ui.nowM.textContent = '第 ' + m + ' 小節';
  renderBig(m);
  msEls.forEach((el, k) => el && el.classList.toggle('playing', k === m && playing));
  if (lastCurKey && sylEls[lastCurKey]) sylEls[lastCurKey].classList.remove('cur');
  ui.lyricBig.querySelectorAll('.syl').forEach(s => s.classList.remove('cur'));
  if (ev) {
    ui.nowNote.textContent = ev.label + '（' + ev.solfa + '）';
    const key = ev.m + '-' + ev.j;
    if (ev.lyric) {
      lastCurKey = key;
      if (sylEls[key]) sylEls[key].classList.add('cur');
      let reached = false;
      ui.lyricBig.querySelectorAll('.syl').forEach(s => {
        if (s.dataset.key === key) { s.classList.add('cur'); s.classList.remove('done'); reached = true; }
        else if (!reached) s.classList.add('done');
      });
    }
  } else {
    ui.nowNote.textContent = '–';
  }
}

// ===== 音訊 =====
let ctx = null, master = null;
function makeMaster() {
  master = ctx.createGain();
  master.gain.value = (+ui.vol.value / 100) * 0.9;
  master.connect(ctx.destination);
}
function ensureAudio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    makeMaster();
  }
  master.gain.value = (+ui.vol.value / 100) * 0.9;
  if (ctx.state === 'suspended') ctx.resume();
}
const live = new Set();
function track(node, t0, stopAt) { live.add(node); node.onended = () => live.delete(node); node.start(t0); node.stop(stopAt); }

function playNote(midi, t0, dur) {
  const f = 440 * Math.pow(2, (midi - 69) / 12);
  const timbre = ui.timbre.value;
  const out = ctx.createGain();
  out.connect(master);
  const end = t0 + dur;
  if (timbre === 'piano') {
    const o1 = ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = f;
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2;
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    o1.connect(out); o2.connect(g2).connect(out);
    out.gain.setValueAtTime(0.0001, t0);
    out.gain.exponentialRampToValueAtTime(0.55, t0 + 0.008);
    out.gain.exponentialRampToValueAtTime(0.18, t0 + 0.35);
    out.gain.setTargetAtTime(0.0001, Math.max(t0 + 0.36, end - 0.05), 0.12);
    track(o1, t0, end + 0.6); track(o2, t0, end + 0.6);
    return;
  }
  const atk = timbre === 'pure' ? 0.02 : 0.06;
  const rel = 0.07;
  const sus = timbre === 'pure' ? 0.45 : 0.6;
  out.gain.setValueAtTime(0.0001, t0);
  out.gain.linearRampToValueAtTime(sus, t0 + atk);
  out.gain.setValueAtTime(sus, Math.max(t0 + atk, end - rel));
  out.gain.linearRampToValueAtTime(0.0001, end);
  if (timbre === 'pure') {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    o.connect(out); track(o, t0, end + 0.05);
    return;
  }
  // 人聲：鋸齒波經過「oo」母音共振峰，再加一點顫音
  const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
  const body = ctx.createOscillator(); body.type = 'sine'; body.frequency.value = f;
  const vib = ctx.createOscillator(); vib.frequency.value = 5.3;
  const vibG = ctx.createGain();
  vibG.gain.setValueAtTime(0, t0);
  vibG.gain.linearRampToValueAtTime(f * 0.012, t0 + Math.min(0.5, dur * 0.6));
  vib.connect(vibG);
  vibG.connect(o.frequency);
  vibG.connect(body.frequency);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400; lp.Q.value = 0.5;
  const f1 = ctx.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 320; f1.Q.value = 4;
  const f2 = ctx.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 800; f2.Q.value = 6;
  const g1 = ctx.createGain(); g1.gain.value = 2.2;
  const g2 = ctx.createGain(); g2.gain.value = 0.9;
  const bodyG = ctx.createGain(); bodyG.gain.value = 0.35;
  o.connect(lp);
  lp.connect(f1).connect(g1).connect(out);
  lp.connect(f2).connect(g2).connect(out);
  body.connect(bodyG).connect(out);
  track(o, t0, end + 0.05); track(vib, t0, end + 0.05); track(body, t0, end + 0.05);
}

function click(t0, accent) {
  const o = ctx.createOscillator(); o.type = 'square';
  o.frequency.value = accent ? 1760 : 1180;
  const g = ctx.createGain();
  g.gain.setValueAtTime(accent ? 0.22 : 0.12, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.04);
  o.connect(g).connect(master);
  track(o, t0, t0 + 0.05);
}

// ===== 排程 =====
let playing = false;
let plan = null; // {t0, items, endAt, a, b}
let timer = null, raf = null;
let nextIdx = 0;

function quarterSec(m) { return 60 / (+ui.tempo.value * SONG.beatUnit) / ritardFactor(m); }

function buildPlan(a, b, withCount) {
  const items = [];
  let clock = 0;
  const unit = SONG.beatUnit;
  const qsA = quarterSec(a);
  if (withCount) {
    for (let k = 0; k < BEATS_PER_BAR / unit; k++) items.push({ at: k * unit * qsA, kind: 'click', accent: k === 0 });
    clock = BEATS_PER_BAR * qsA;
  }
  const mTime = [];
  for (let m = a; m <= b; m++) {
    mTime[m] = clock;
    const qs = quarterSec(m);
    if ($('metro').checked) for (let k = 0; k < barLen(m) / unit; k++) items.push({ at: clock + k * unit * qs, kind: 'click', accent: k === 0 });
    items.push({ at: clock, kind: 'bar', m });
    clock += barLen(m) * qs;
  }
  const beatToTime = (beat) => {
    let m = a;
    while (m <= b && measureStart[m + 1] <= beat + 1e-9) m++;
    if (m > b) return clock;
    return mTime[m] + (beat - measureStart[m]) * quarterSec(m);
  };
  const s = measureStart[a], e = measureStart[b + 1];
  for (const ev of events) {
    const evEnd = ev.start + ev.dur;
    if (evEnd <= s + 1e-9 || ev.start >= e - 1e-9) continue;
    const st = Math.max(ev.start, s), en = Math.min(evEnd, e);
    const at = beatToTime(st), end = beatToTime(en);
    items.push({ at, kind: 'note', ev, dur: Math.max(0.05, end - at - 0.02) });
  }
  items.sort((x, y) => x.at - y.at || (x.kind === 'bar' ? -1 : y.kind === 'bar' ? 1 : 0));
  return { items, endAt: clock, a, b, firstBarAt: mTime[a] };
}

function startPlayback() {
  stopPlayback(true);
  ensureAudio();
  const a = clampM(ui.startM.value);
  let b = clampM(ui.endM.value);
  if (b < a) { b = TOTAL_M; ui.endM.value = b; }
  plan = buildPlan(a, b, $('countin').checked);
  plan.t0 = ctx.currentTime + 0.12;
  nextIdx = 0;
  playing = true;
  ui.play.textContent = '❚❚ 暫停';
  timer = setInterval(schedule, 25);
  schedule();
  raf = requestAnimationFrame(tick);
}

function schedule() {
  if (!playing) return;
  const horizon = ctx.currentTime + 0.15;
  while (nextIdx < plan.items.length && plan.t0 + plan.items[nextIdx].at < horizon) {
    const it = plan.items[nextIdx++];
    const t = plan.t0 + it.at;
    if (it.kind === 'click') click(t, it.accent);
    else if (it.kind === 'note') playNote(it.ev.midi, t, it.dur);
  }
  if (ctx.currentTime > plan.t0 + plan.endAt + 0.05) {
    if ($('loop').checked) {
      startPlayback();
    } else {
      const a = plan.a;
      stopPlayback(false);
      showMeasure(a, null);
    }
  }
}

let shownM = -1, shownEv = null;
function tick() {
  if (!playing) return;
  const now = ctx.currentTime - plan.t0;
  let curM = plan.a, curEv = null;
  for (const it of plan.items) {
    if (it.at > now) break;
    if (it.kind === 'bar') curM = it.m;
    if (it.kind === 'note') curEv = (now < it.at + it.dur + 0.02) ? it.ev : null;
  }
  if (curM !== shownM || curEv !== shownEv) {
    shownM = curM; shownEv = curEv;
    showMeasure(curM, curEv);
  }
  drawRoll(now);
  raf = requestAnimationFrame(tick);
}

function stopPlayback(silentUI) {
  playing = false;
  clearInterval(timer); timer = null;
  cancelAnimationFrame(raf); raf = null;
  for (const n of live) { try { n.stop(); } catch (e) {} }
  live.clear();
  if (ctx && master) {
    // 換一個主輸出，切斷尚未結束的聲音
    const old = master;
    makeMaster();
    try { old.disconnect(); } catch (e) {}
  }
  ui.play.textContent = '▶ 播放';
  msEls.forEach(el => el && el.classList.remove('playing'));
  shownM = -1; shownEv = null;
  if (!silentUI) drawRoll(null);
}

// 暫停：記住目前小節，下次從那裡繼續
function pausePlayback() {
  const m = shownM > 0 ? shownM : clampM(ui.startM.value);
  stopPlayback(false);
  setStart(m);
  drawRoll(null);
}

// ===== 音高示意圖 =====
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
let rollView = { fromBeat: 0, span: 24 };
function currentBeat(now) {
  if (!(playing && plan && now != null)) return measureStart[clampM(ui.startM.value)];
  if (now < plan.firstBarAt) return measureStart[plan.a];
  let beat = measureStart[plan.a];
  for (const it of plan.items) {
    if (it.at > now) break;
    if (it.kind === 'bar') beat = measureStart[it.m] + Math.min(barLen(it.m), (now - it.at) / quarterSec(it.m));
  }
  return beat;
}
function drawRoll(now) {
  const cv = ui.roll;
  const dpr = devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const beat = currentBeat(now);
  const span = BEATS_PER_BAR * (W < 500 ? 2 : 4);
  const from = beat - span * 0.3;
  rollView = { fromBeat: from, span };
  const x = b => (b - from) / span * W;
  const y = mi => H - 18 - (mi - MIN_MIDI) / (MAX_MIDI - MIN_MIDI) * (H - 50);
  const labelMode = $('pitchLabel').value;
  const line = cssVar('--line'), muted = cssVar('--muted'), acc = cssVar('--accent'), nowC = cssVar('--now'), ink = cssVar('--ink');
  g.font = '11px system-ui, sans-serif';
  for (let m = 1; m <= TOTAL_M + 1; m++) {
    const bx = x(measureStart[m]);
    if (bx < -2 || bx > W + 2) continue;
    g.strokeStyle = line; g.lineWidth = 1;
    g.beginPath(); g.moveTo(bx, 0); g.lineTo(bx, H); g.stroke();
    if (m <= TOTAL_M) { g.fillStyle = muted; g.fillText(String(m), bx + 3, 12); }
  }
  for (const ev of events) {
    const x0 = x(ev.start), x1 = x(ev.start + ev.dur);
    if (x1 < 0 || x0 > W) continue;
    const yy = y(ev.midi);
    const active = playing && beat >= ev.start && beat < ev.start + ev.dur;
    g.fillStyle = active ? nowC : acc;
    g.globalAlpha = active ? 1 : 0.75;
    g.fillRect(x0 + 1, yy - 4, Math.max(2, x1 - x0 - 2), 8);
    g.globalAlpha = 1;
    if (ev.lyric && x1 - x0 > 10) {
      g.fillStyle = ink;
      g.font = '12px "Noto Sans TC", system-ui, sans-serif';
      g.fillText(ev.lyric, x0 + 2, yy - 8);
    }
    if (labelMode !== 'none') {
      g.fillStyle = active ? nowC : muted;
      g.font = '11px system-ui, sans-serif';
      g.fillText(labelMode === 'solfa' ? ev.solfa : ev.label, x0 + 2, yy + 14);
    }
  }
  const px = x(beat);
  g.strokeStyle = nowC; g.lineWidth = 2;
  g.beginPath(); g.moveTo(px, 0); g.lineTo(px, H); g.stroke();
}
ui.roll.addEventListener('click', (e) => {
  const r = ui.roll.getBoundingClientRect();
  const b = rollView.fromBeat + (e.clientX - r.left) / r.width * rollView.span;
  let m = 1;
  while (m < TOTAL_M && measureStart[m + 1] <= b) m++;
  setStart(m); startPlayback();
});

// ===== 控制項 =====
ui.play.addEventListener('click', () => { if (playing) pausePlayback(); else startPlayback(); });
ui.stop.addEventListener('click', () => { const a = plan ? plan.a : clampM(ui.startM.value); stopPlayback(false); setStart(a); drawRoll(null); });
function step(d) {
  const wasPlaying = playing;
  const base = wasPlaying && shownM > 0 ? shownM : clampM(ui.startM.value);
  if (wasPlaying) stopPlayback(true);
  setStart(base + d);
  if (wasPlaying) startPlayback(); else drawRoll(null);
}
ui.prev.addEventListener('click', () => step(-1));
ui.next.addEventListener('click', () => step(1));
ui.tempo.addEventListener('input', () => { ui.tempoVal.textContent = ui.tempo.value; save(); });
ui.tempo.addEventListener('change', () => {
  if (playing) { const m = shownM > 0 ? shownM : clampM(ui.startM.value); stopPlayback(true); setStart(m); startPlayback(); }
});
ui.vol.addEventListener('input', () => { ui.volVal.textContent = ui.vol.value + '%'; if (master) master.gain.value = (+ui.vol.value / 100) * 0.9; save(); });
ui.startM.addEventListener('change', () => { setStart(ui.startM.value); drawRoll(null); });
ui.endM.addEventListener('change', () => { ui.endM.value = clampM(ui.endM.value); refreshRange(); save(); });
['timbre', 'metro', 'countin', 'loop', 'ritard'].forEach(id => $(id).addEventListener('change', save));
$('pitchLabel').addEventListener('change', () => { save(); if (!playing) drawRoll(null); });
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); ui.play.click(); }
  if (e.code === 'ArrowLeft') step(-1);
  if (e.code === 'ArrowRight') step(1);
});
addEventListener('resize', () => { if (!playing) drawRoll(null); });

// 偏好設定只存在本機瀏覽器（每首歌各自一份）
function save() {
  if (!SONG) return;
  try {
    localStorage.setItem(SONG.storageKey, JSON.stringify({
      tempo: ui.tempo.value, vol: ui.vol.value, timbre: ui.timbre.value, start: ui.startM.value, end: ui.endM.value,
      metro: $('metro').checked, countin: $('countin').checked, loop: $('loop').checked, ritard: $('ritard').checked,
      pitchLabel: $('pitchLabel').value,
    }));
  } catch (e) {}
}
function load() {
  ui.tempo.value = SONG.tempo.def; ui.tempoVal.textContent = SONG.tempo.def;
  ui.startM.value = 1; ui.endM.value = TOTAL_M;
  try {
    const s = JSON.parse(localStorage.getItem(SONG.storageKey) || 'null');
    if (!s) return;
    ui.tempo.value = s.tempo; ui.tempoVal.textContent = ui.tempo.value;
    ui.vol.value = s.vol; ui.volVal.textContent = s.vol + '%';
    ui.timbre.value = s.timbre; ui.startM.value = clampM(s.start); ui.endM.value = clampM(s.end);
    $('metro').checked = s.metro; $('countin').checked = s.countin; $('loop').checked = s.loop; $('ritard').checked = s.ritard;
    if (s.pitchLabel) $('pitchLabel').value = s.pitchLabel;
  } catch (e) {}
}

function loadSong(id) {
  if (playing) stopPlayback(true);
  plan = null;
  SONG = SONGS.find(s => s.id === id) || SONGS[0];
  SCORE = SONG.score;
  BEATS_PER_BAR = SONG.beatsPerBar;
  TOTAL_M = SCORE.length;
  buildEvents();
  bigFor = -1; lastCurKey = null;
  renderSong();
  load();
  refreshRange();
  showMeasure(clampM(ui.startM.value), null);
  drawRoll(null);
  try { localStorage.setItem('tenorPractice:song', SONG.id); } catch (e) {}
  if (location.hash.slice(1) !== SONG.id) history.replaceState(null, '', '#' + SONG.id);
}
addEventListener('hashchange', () => { const id = location.hash.slice(1); if (SONGS.some(s => s.id === id) && id !== SONG.id) loadSong(id); });

(function init() {
  let id = location.hash.slice(1);
  if (!SONGS.some(s => s.id === id)) {
    try { id = localStorage.getItem('tenorPractice:song') || ''; } catch (e) { id = ''; }
  }
  loadSong(id);
})();
</script>
</body>
</html>
